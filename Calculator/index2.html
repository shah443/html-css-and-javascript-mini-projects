
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div id="calculator">

        <input type="text" id="display" readonly>

        <div id="buttons">

            <button id="clear">C</button>
            <button>/</button>
            <button>*</button>
            <button>-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>.</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button id="equal">=</button>

            <button id="zero">0</button>

        </div>

    </div>

    <script src="script3.js"></script>

</body>
</html>
